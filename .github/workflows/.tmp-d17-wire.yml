name: Temporary D17 Wiring
on:
  push:
    branches: ['teaching/d17-assessment-domain']
permissions:
  contents: write
jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[d17-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: teaching/d17-assessment-domain}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/.tmp-apply-d17-wiring.js
      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teaching/index.js teaching-backend.js services/integrity/repository.js services/integrity/service.js scripts/setup-teaching-integration-db.js package.json
          git commit -m 'Wire D17 Assessment domain [d17-wired]'
          git push origin HEAD:teaching/d17-assessment-domain
