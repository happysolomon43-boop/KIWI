name: Teaching D15 Attendance
on:
  pull_request:
    paths:
      - 'teaching/**'
      - 'public/teaching*'
      - 'public/kiwi-runtime-config.js'
      - 'teaching-backend.js'
      - 'index.js'
      - 'migrations/**'
      - 'tests/teaching/**'
      - 'scripts/verify-teaching-d*.js'
      - 'scripts/setup-teaching-integration-db.js'
      - 'docs/teaching/**'
      - 'package.json'
      - '.github/workflows/teaching-d15-attendance.yml'
  push:
    branches: [main]
    paths:
      - 'teaching/**'
      - 'public/teaching*'
      - 'public/kiwi-runtime-config.js'
      - 'teaching-backend.js'
      - 'index.js'
      - 'migrations/**'
      - 'tests/teaching/**'
      - 'scripts/verify-teaching-d*.js'
      - 'scripts/setup-teaching-integration-db.js'
      - 'docs/teaching/**'
      - 'package.json'
      - '.github/workflows/teaching-d15-attendance.yml'

jobs:
  d15:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: D01-D15 canonical verifiers
        run: for n in $(seq -w 1 15); do npm run verify:teaching:d$n; done
      - name: Teaching unit regressions
        run: npm run test:teaching
      - name: Full unit regressions
        run: npm test
      - name: Web build
        run: npm run build:web

  d15-isolated-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: kiwi_teaching_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_teaching_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEACHING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwi_teaching_test
      TEACHING_TEST_PROJECT_REF: local-d15-ci
      TEACHING_TEST_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Reconstruct Teaching database through D15
        run: node scripts/setup-teaching-integration-db.js
      - name: D02-D15 integration regressions
        run: npm run test:teaching:integration
