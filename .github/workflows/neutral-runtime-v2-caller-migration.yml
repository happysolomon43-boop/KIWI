name: Neutral Runtime V2 Caller Migration

on:
  push:
    branches:
      - aim/model-neutral-runtime-v2
    paths:
      - 'scripts/migrate-neutral-ai-callers.js'
      - '.github/workflows/neutral-runtime-v2-caller-migration.yml'

permissions:
  contents: write

jobs:
  migrate-callers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Branch B
        uses: actions/checkout@v4
        with:
          ref: aim/model-neutral-runtime-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run guarded caller migration
        run: node scripts/migrate-neutral-ai-callers.js

      - name: Validate migrated syntax
        run: |
          node --check index.js
          node --check services/reckoning/preparation.js
          git diff --check

      - name: Commit verified caller migration
        run: |
          if git diff --quiet; then
            echo 'No caller migration changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.js services/reckoning/preparation.js
          git commit -m 'refactor(ai): migrate production callers to neutral contracts'
          git push origin HEAD:aim/model-neutral-runtime-v2
