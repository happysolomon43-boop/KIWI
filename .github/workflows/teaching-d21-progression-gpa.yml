name: Teaching D21 Progression and GPA
on:
  pull_request:
    paths: ['teaching/d21/**','teaching/d20/d21-resit-owner.js','teaching/d20/routes.js','teaching/repositories/d21-progression.js','teaching/repositories/d21-progression/**','teaching/repositories/index.js','teaching/index.js','teaching/d17/routes.js','tests/teaching/**','scripts/verify-teaching-d*.js','scripts/setup-teaching-integration-db.js','migrations/20261003_teaching_d21_*.sql','docs/teaching/d21*','package.json','.github/workflows/teaching-d21-progression-gpa.yml']
  push:
    branches: [main, 'teaching/d21-progression-gpa']
    paths: ['teaching/d21/**','teaching/d20/d21-resit-owner.js','teaching/d20/routes.js','teaching/repositories/d21-progression.js','teaching/repositories/d21-progression/**','teaching/repositories/index.js','teaching/index.js','teaching/d17/routes.js','tests/teaching/**','scripts/verify-teaching-d*.js','scripts/setup-teaching-integration-db.js','migrations/20261003_teaching_d21_*.sql','docs/teaching/d21*','package.json','.github/workflows/teaching-d21-progression-gpa.yml']
jobs:
  d21:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: D21 syntax and canonical verifier
        run: |
          node --check teaching/d21/contracts.js
          node --check teaching/d21/engine.js
          node --check teaching/d21/gpa.js
          node --check teaching/d21/intelligence.js
          node --check teaching/d21/service.js
          node --check teaching/d21/routes.js
          node --check teaching/d21/ui.js
          node --check teaching/d20/d21-resit-owner.js
          node --check teaching/repositories/d21-progression.js
          node --check teaching/repositories/d21-progression/core.js
          node --check teaching/repositories/d21-progression/snapshot.js
          node --check teaching/repositories/d21-progression/pathways.js
          node --check teaching/repositories/d21-progression/preparation.js
          node --check teaching/repositories/d21-progression/gpa.js
          npm run verify:teaching:d21
      - name: D01-D20 predecessor verifiers
        run: for n in $(seq -w 1 20); do npm run verify:teaching:d$n; done
      - name: D21 focused unit tests
        run: node --test tests/teaching/unit/d21-*.test.js
      - name: Teaching unit regressions
        run: npm run test:teaching
      - name: Full unit regressions
        run: npm test
      - name: Web build
        run: npm run build:web
  d21-isolated-db:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: kiwi_teaching_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_teaching_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEACHING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwi_teaching_test
      TEACHING_TEST_PROJECT_REF: local-d21-ci
      TEACHING_TEST_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: node scripts/setup-teaching-integration-db.js
      - run: node --test tests/teaching/integration/d20-marking-gradebook-schema.test.js tests/teaching/integration/d21-progression-gpa-schema.test.js
      - run: npm run test:teaching:integration
