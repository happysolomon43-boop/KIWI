name: One-shot legacy Study integrity cleanup

on:
  push:
    branches:
      - study/remove-legacy-exam-integrity

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: study/remove-legacy-exam-integrity
          fetch-depth: 0
      - name: Print exact live integrity contexts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          src = Path('index.html').read_text(encoding='utf-8')
          needles = [
              '_startExamIntegrityGuard',
              '_renderIntegrityExamLock',
              '_lockExamPage',
              '_unlockExamPage',
              '/forfeit',
              'student_manual',
              'confirmed',
              'pagehide',
              'beforeunload',
              'visibilitychange',
              'integrityGuard',
              'departureCount',
              'examDeparture',
              'integrityDeparture',
          ]
          for needle in needles:
              print(f'\n===== {needle} count={src.count(needle)} =====')
              start = 0
              shown = 0
              while shown < 8:
                  idx = src.find(needle, start)
                  if idx < 0:
                      break
                  lo = max(0, idx - 700)
                  hi = min(len(src), idx + len(needle) + 1100)
                  print(src[lo:hi])
                  print('\n--- occurrence boundary ---')
                  shown += 1
                  start = idx + len(needle)
          print('\n===== suspicious lifecycle/forfeit lines =====')
          for n, line in enumerate(src.splitlines(), 1):
              lower = line.lower()
              if any(x in lower for x in ('forfeit', 'pagehide', 'beforeunload', 'visibilitychange', 'integrityguard', 'departurecount', 'examdeparture', 'integritydeparture')):
                  print(f'{n}: {line}')
          PY
