name: One-shot legacy Study integrity cleanup

on:
  push:
    branches:
      - study/remove-legacy-exam-integrity

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: study/remove-legacy-exam-integrity
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply audited legacy integrity cleanup
        run: python scripts/cleanup-legacy-exam-integrity-once.py

      - name: Focused syntax and behavior verification
        shell: bash
        run: |
          node --check public/kiwi-integrity-session-guard.js
          node --test tests/teaching/unit/study-global-exam-integrity-lockout.test.js tests/teaching/unit/integrity-session-guard-amendment.test.js
          ! grep -q '_startExamIntegrityGuard' index.html
          ! grep -q '_renderIntegrityExamLock' index.html
          ! grep -q 'KIWIIntegritySessionGuard\.activate' index.html
          ! grep -q 'KIWIIntegritySessionGuard\.deactivate' index.html
          grep -q 'kiwi:exam-ended' index.html
          grep -q 'kiwi:exam-ended' public/kiwi-integrity-session-guard.js
          grep -q '/kiwi-integrity-session-guard.js' index.html
          git diff --check

      - name: Commit cleanup and retire migration helpers
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_legacy-integrity-cleanup-once.yml scripts/cleanup-legacy-exam-integrity-once.py
          git add index.html public/kiwi-integrity-session-guard.js tests/teaching/unit/study-global-exam-integrity-lockout.test.js tests/teaching/unit/integrity-session-guard-amendment.test.js
          git diff --cached --check
          git commit -m 'refactor(study): centralize exam integrity lifecycle ownership'
          git push origin HEAD:study/remove-legacy-exam-integrity
