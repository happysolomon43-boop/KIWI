name: Teaching D16 one-time wiring

on:
  push:
    branches:
      - teaching/d16-homework-integrity
    paths:
      - .github/workflows/teaching-d16-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: teaching/d16-homework-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply D16 integration wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f"Expected wiring anchor missing in {path}: {old[:100]}")
              if s.count(old)!=1:
                  raise SystemExit(f"Wiring anchor is not unique in {path}")
              p.write_text(s.replace(old,new,1))

          replace_once('teaching-backend.js',
              "const { mountD15Routes } = require('./teaching/d15/routes');",
              "const { mountD15Routes } = require('./teaching/d15/routes');\nconst { mountD16Routes } = require('./teaching/d16/routes');")
          replace_once('teaching-backend.js',
              "  d13PublishedEventRegistry = null,\n  teachingRuntimePlatform = null,",
              "  d13PublishedEventRegistry = null,\n  d16Intelligence = null,\n  teachingRuntimePlatform = null,")
          replace_once('teaching-backend.js',
              "    d13Intelligence,\n    d13PublishedEventRegistry,\n  });",
              "    d13Intelligence,\n    d13PublishedEventRegistry,\n    d16Intelligence,\n  });")
          replace_once('teaching-backend.js',
              "  mountD15Routes(router,{foundation,sendError});\n\n  const studentKnowledgeModelService",
              "  mountD15Routes(router,{foundation,sendError});\n\n  // D16 mounts the authoritative Work projections and student intents. The\n  // Assignment/Submission owner remains server-side; browser state never owns\n  // deadlines, policy versions, integrity outcomes or final submission time.\n  mountD16Routes(router,{foundation,sendError});\n\n  const studentKnowledgeModelService")

          replace_once('public/teaching.html',
              '  <link rel="stylesheet" href="/teaching-classroom.css" />',
              '  <link rel="stylesheet" href="/teaching-classroom.css" />\n  <link rel="stylesheet" href="/teaching-d16.css" />')
          replace_once('public/teaching.html',
              '  <script type="module" src="/teaching-classroom.js"></script>',
              '  <script type="module" src="/teaching-classroom.js"></script>\n  <script type="module" src="/teaching-d16.js"></script>')

          replace_once('scripts/setup-teaching-integration-db.js',
              "  'migrations/20260930_teaching_d15_attendance.sql',\n]);",
              "  'migrations/20260930_teaching_d15_attendance.sql',\n  'migrations/20261001_teaching_d16_homework_integrity.sql',\n]);")

          pkg_path=Path('package.json'); pkg=json.loads(pkg_path.read_text())
          pkg['scripts']['verify:teaching:d16']='node scripts/verify-teaching-d16-homework-integrity.js'
          pkg_path.write_text(json.dumps(pkg,indent=2)+"\n")

          replace_once('teaching/d10/contracts.js',
              "ASSIGNMENT_EXTENSION: Object.freeze({ owner:'work', target:'ASSIGNMENT', implementedOwner:false })",
              "ASSIGNMENT_EXTENSION: Object.freeze({ owner:'work', target:'ASSIGNMENT', implementedOwner:true })")
          PY
      - name: Validate syntax and focused D16 tests
        run: |
          node --check teaching-backend.js
          node --check teaching/d16/contracts.js
          node --check teaching/d16/service.js
          node --check teaching/d16/runtime.js
          node --check teaching/d16/routes.js
          node --check teaching/repositories/d16-assignments.js
          node --check public/teaching-d16.js
          node --test tests/teaching/unit/d16-homework-integrity.test.js
      - name: Commit wiring and remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/teaching-d16-wire.yml
          git add teaching-backend.js public/teaching.html scripts/setup-teaching-integration-db.js package.json teaching/d10/contracts.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "D16: mount Work API and workspace"
          git push origin HEAD:teaching/d16-homework-integrity
