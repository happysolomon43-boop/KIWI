name: Apply Integrity Session UI Amendment
on:
  push:
    branches: [teaching/integrity-session-guard-amendment]
    paths:
      - 'scripts/apply-integrity-session-ui-amendment.js'
      - '.github/workflows/apply-integrity-session-ui-amendment.yml'
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[integrity-ui-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: teaching/integrity-session-guard-amendment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apply-integrity-session-ui-amendment.js
      - name: Commit generated source edits
        run: |
          if git diff --quiet; then
            echo 'No integrity UI edits required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html public/teaching.html public/teaching-d16.js services/integrity/service.js
          git commit -m 'Apply integrity session UI amendment [integrity-ui-patched]'
          git push origin HEAD:teaching/integrity-session-guard-amendment
