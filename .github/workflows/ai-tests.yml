name: AI Orchestrator Tests

on:
  pull_request:
    paths:
      - 'services/ai/**'
      - 'services/reckoning/**'
      - 'index.js'
      - 'tests/ai/**'
      - 'package.json'
      - 'vercel.json'
      - 'public/tree/**'
      - 'scripts/build-web.js'
      - 'scripts/sync-pixi-vendor.js'
      - '.github/workflows/ai-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'services/ai/**'
      - 'services/reckoning/**'
      - 'index.js'
      - 'tests/ai/**'
      - 'package.json'
      - 'vercel.json'
      - 'public/tree/**'
      - 'scripts/build-web.js'
      - 'scripts/sync-pixi-vendor.js'
      - '.github/workflows/ai-tests.yml'

permissions:
  contents: read

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check backend syntax
        run: node --check index.js

      - name: Run AI architecture tests
        run: npm run test:ai