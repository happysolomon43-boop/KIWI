name: Temporary D17 Final Guard
on:
  push:
    branches: ['teaching/d17-assessment-domain']
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[d17-final-guard]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: teaching/d17-assessment-domain}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node scripts/.tmp-d17-final-guard.js
      - name: Commit guard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add teaching/d17/service.js
          git commit -m 'Fail closed on missing D17 PPL workspace [d17-final-guard]'
          git push origin HEAD:teaching/d17-assessment-domain
