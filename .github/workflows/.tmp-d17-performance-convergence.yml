name: Temporary D17 Schema Performance Convergence
on:
  push:
    branches: ['teaching/d17-assessment-domain']
permissions:
  contents: write
jobs:
  converge:
    if: ${{ !contains(github.event.head_commit.message, '[d17-performance-converged]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: kiwi_teaching_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_teaching_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEACHING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwi_teaching_test
      TEACHING_TEST_PROJECT_REF: local-d17-performance
      TEACHING_TEST_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: teaching/d17-assessment-domain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Add canonical D17 performance convergence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          migration=Path('migrations/20261002_teaching_d17_assessment_domain.sql')
          text=migration.read_text()
          anchor='-- Remove abandoned pre-freeze D17 package guards before installing the canonical freeze model.\n'
          block='''-- Converge abandoned pre-freeze D17 uniqueness/index artifacts. The canonical\n-- named indexes above remain the authoritative uniqueness implementations.\nALTER TABLE public.teaching_assessment_attempt_events DROP CONSTRAINT IF EXISTS teaching_assessment_attempt_even_student_id_idempotency_key_key;\nALTER TABLE public.teaching_assessment_attempts DROP CONSTRAINT IF EXISTS teaching_assessment_attempts_assessment_id_student_id_attem_key;\nALTER TABLE public.teaching_assessment_blueprints DROP CONSTRAINT IF EXISTS teaching_assessment_blueprints_assessment_id_version_no_key;\nALTER TABLE public.teaching_assessment_blueprints DROP CONSTRAINT IF EXISTS teaching_assessment_blueprints_student_id_idempotency_key_key;\nALTER TABLE public.teaching_assessment_candidate_versions DROP CONSTRAINT IF EXISTS teaching_assessment_candidate_assessment_candidate_id_versi_key;\nALTER TABLE public.teaching_assessment_candidates DROP CONSTRAINT IF EXISTS teaching_assessment_candidate_assessment_blueprint_id_slot__key;\nALTER TABLE public.teaching_assessment_contamination_events DROP CONSTRAINT IF EXISTS teaching_assessment_contaminatio_student_id_idempotency_key_key;\nALTER TABLE public.teaching_assessment_eligibility_entries DROP CONSTRAINT IF EXISTS teaching_assessment_eligibili_assessment_id_blueprint_versi_key;\nALTER TABLE public.teaching_assessment_invalidations DROP CONSTRAINT IF EXISTS teaching_assessment_invalidation_student_id_idempotency_key_key;\nALTER TABLE public.teaching_assessment_item_challenges DROP CONSTRAINT IF EXISTS teaching_assessment_item_challen_student_id_idempotency_key_key;\nALTER TABLE public.teaching_assessment_package_items DROP CONSTRAINT IF EXISTS teaching_assessment_package_i_assessment_package_id_ordinal_key;\nALTER TABLE public.teaching_assessment_packages DROP CONSTRAINT IF EXISTS teaching_assessment_packages_assessment_id_version_no_key;\nALTER TABLE public.teaching_assessment_ppl_workspaces DROP CONSTRAINT IF EXISTS teaching_assessment_ppl_workspaces_assessment_id_lane_key;\nALTER TABLE public.teaching_assessment_responses DROP CONSTRAINT IF EXISTS teaching_assessment_responses_assessment_attempt_id_package_key;\nALTER TABLE public.teaching_assessment_responses DROP CONSTRAINT IF EXISTS teaching_assessment_responses_student_id_idempotency_key_key;\nALTER TABLE public.teaching_assessment_validations DROP CONSTRAINT IF EXISTS teaching_assessment_validations_student_id_idempotency_key_key;\nDROP INDEX IF EXISTS public.teaching_assessment_packages_student_idempotency_uq;\nDROP INDEX IF EXISTS public.teaching_assessments_student_idempotency_uq;\n\n-- Cover every D17 foreign-key owner column that is not already the leading key\n-- of a canonical index. These are performance indexes only; they do not change authority.\nCREATE INDEX IF NOT EXISTS teaching_assessment_blueprints_supersedes_idx ON public.teaching_assessment_blueprints(supersedes_blueprint_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_candidate_versions_supersedes_idx ON public.teaching_assessment_candidate_versions(supersedes_candidate_version_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_candidate_versions_assessment_fk_idx ON public.teaching_assessment_candidate_versions(assessment_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_candidates_assessment_fk_idx ON public.teaching_assessment_candidates(assessment_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_contamination_candidate_version_idx ON public.teaching_assessment_contamination_events(candidate_version_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_contamination_assessment_idx ON public.teaching_assessment_contamination_events(assessment_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_invalidations_assessment_idx ON public.teaching_assessment_invalidations(assessment_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_item_challenges_attempt_idx ON public.teaching_assessment_item_challenges(assessment_attempt_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_item_challenges_package_item_idx ON public.teaching_assessment_item_challenges(package_item_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_package_items_assessment_idx ON public.teaching_assessment_package_items(assessment_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_package_items_candidate_version_idx ON public.teaching_assessment_package_items(candidate_version_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_packages_blueprint_idx ON public.teaching_assessment_packages(assessment_blueprint_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_responses_package_item_idx ON public.teaching_assessment_responses(package_item_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_validations_candidate_version_idx ON public.teaching_assessment_validations(candidate_version_id);\nCREATE INDEX IF NOT EXISTS teaching_assessment_validations_package_idx ON public.teaching_assessment_validations(package_id);\nCREATE INDEX IF NOT EXISTS teaching_assessments_course_idx ON public.teaching_assessments(course_id);\nCREATE INDEX IF NOT EXISTS teaching_assessments_supersedes_idx ON public.teaching_assessments(supersedes_assessment_id);\n\n'''
          if block not in text:
              if text.count(anchor)!=1: raise SystemExit('D17 performance migration anchor mismatch')
              text=text.replace(anchor,block+anchor)
          migration.write_text(text)

          test=Path('tests/teaching/integration/d17-assessment-domain-schema.test.js')
          text=test.read_text()
          block_test='''\n\ntest('D17 schema has no exact duplicate indexes after provisional Integration convergence',{skip},async()=>{const pool=createIntegrationPool(url);try{const {rows}=await pool.query("select t.relname table_name,i.indisunique,i.indkey::text indkey,coalesce(pg_get_expr(i.indpred,i.indrelid),'') predicate,count(*)::int n,array_agg(c.relname order by c.relname) indexes from pg_index i join pg_class c on c.oid=i.indexrelid join pg_class t on t.oid=i.indrelid where t.relname=any($1::text[]) and i.indisvalid and i.indisready group by t.relname,i.indisunique,i.indkey::text,coalesce(pg_get_expr(i.indpred,i.indrelid),'') having count(*)>1 order by t.relname",[tables]);assert.deepEqual(rows,[]);}finally{await pool.end();}});\n\ntest('D17 every foreign key has a leading covering index',{skip},async()=>{const pool=createIntegrationPool(url);try{const {rows}=await pool.query("with d17_tables as (select oid,relname from pg_class where relnamespace='public'::regnamespace and relkind='r' and relname=any($1::text[])), fks as (select c.conname,c.conrelid,c.conkey,t.relname table_name from pg_constraint c join d17_tables t on t.oid=c.conrelid where c.contype='f') select table_name,conname from fks f where not exists(select 1 from pg_index i where i.indrelid=f.conrelid and i.indisvalid and i.indisready and (i.indkey::smallint[])[0:cardinality(f.conkey)-1]=f.conkey) order by table_name,conname",[tables]);assert.deepEqual(rows,[]);}finally{await pool.end();}});\n'''
          if "D17 schema has no exact duplicate indexes" not in text:
              text += block_test
          test.write_text(text)

          verifier=Path('scripts/verify-teaching-d17-assessment-domain.js')
          text=verifier.read_text()
          anchor="  /RETURNS trigger LANGUAGE plpgsql SET search_path=pg_catalog,public/,\n"
          additions="""  /DROP CONSTRAINT IF EXISTS teaching_assessment_blueprints_assessment_id_version_no_key/,\n  /DROP INDEX IF EXISTS public\\.teaching_assessment_packages_student_idempotency_uq/,\n  /DROP INDEX IF EXISTS public\\.teaching_assessments_student_idempotency_uq/,\n  /teaching_assessment_blueprints_supersedes_idx/,\n  /teaching_assessment_candidate_versions_supersedes_idx/,\n  /teaching_assessment_candidate_versions_assessment_fk_idx/,\n  /teaching_assessment_candidates_assessment_fk_idx/,\n  /teaching_assessment_contamination_candidate_version_idx/,\n  /teaching_assessment_contamination_assessment_idx/,\n  /teaching_assessment_invalidations_assessment_idx/,\n  /teaching_assessment_item_challenges_attempt_idx/,\n  /teaching_assessment_item_challenges_package_item_idx/,\n  /teaching_assessment_package_items_assessment_idx/,\n  /teaching_assessment_package_items_candidate_version_idx/,\n  /teaching_assessment_packages_blueprint_idx/,\n  /teaching_assessment_responses_package_item_idx/,\n  /teaching_assessment_validations_candidate_version_idx/,\n  /teaching_assessment_validations_package_idx/,\n  /teaching_assessments_course_idx/,\n  /teaching_assessments_supersedes_idx/,\n"""
          if additions not in text:
              if text.count(anchor)!=1: raise SystemExit('D17 verifier performance anchor mismatch')
              text=text.replace(anchor,anchor+additions)
          verifier.write_text(text)
          PY
      - name: Verify clean D17 reconstruction and performance invariants
        run: |
          npm run verify:teaching:d17
          node scripts/setup-teaching-integration-db.js
          node --test tests/teaching/integration/d17-assessment-domain-schema.test.js
      - name: Simulate provisional duplicate artifacts and prove convergence
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const {Pool}=require('pg');
          (async()=>{
            const pool=new Pool({connectionString:process.env.TEACHING_TEST_DATABASE_URL});
            try{
              await pool.query(`alter table public.teaching_assessment_blueprints add constraint teaching_assessment_blueprints_assessment_id_version_no_key unique(assessment_id,version_no); create unique index teaching_assessment_packages_student_idempotency_uq on public.teaching_assessment_packages(student_id,idempotency_key); create unique index teaching_assessments_student_idempotency_uq on public.teaching_assessments(student_id,idempotency_key);`);
              await pool.query(fs.readFileSync('migrations/20261002_teaching_d17_assessment_domain.sql','utf8'));
              const stale=await pool.query(`select count(*)::int n from pg_class where relnamespace='public'::regnamespace and relname in ('teaching_assessment_blueprints_assessment_id_version_no_key','teaching_assessment_packages_student_idempotency_uq','teaching_assessments_student_idempotency_uq')`);
              if(stale.rows[0].n!==0) throw new Error('prototype D17 duplicate index artifacts survived convergence');
              const fk=await pool.query(`with d17_tables as (select oid from pg_class where relnamespace='public'::regnamespace and relkind='r' and relname like 'teaching_assessment%'), fks as (select c.conrelid,c.conkey from pg_constraint c join d17_tables t on t.oid=c.conrelid where c.contype='f') select count(*)::int n from fks f where not exists(select 1 from pg_index i where i.indrelid=f.conrelid and i.indisvalid and i.indisready and (i.indkey::smallint[])[0:cardinality(f.conkey)-1]=f.conkey)`);
              if(fk.rows[0].n!==0) throw new Error('D17 foreign keys remain uncovered after convergence');
            } finally { await pool.end(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Commit convergence and retire temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/.tmp-d17-performance-convergence.yml
          git add migrations/20261002_teaching_d17_assessment_domain.sql tests/teaching/integration/d17-assessment-domain-schema.test.js scripts/verify-teaching-d17-assessment-domain.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Converge D17 prototype indexes and FK coverage [d17-performance-converged]'
          git push origin HEAD:teaching/d17-assessment-domain
