name: Teaching D11 Lesson Controller

on:
  pull_request:
    paths:
      - 'teaching/**'
      - 'teaching-backend.js'
      - 'index.js'
      - 'migrations/**'
      - 'tests/teaching/**'
      - 'scripts/verify-teaching-d11-lesson-controller.js'
      - 'docs/teaching/**'
      - 'package.json'
      - '.github/workflows/teaching-d11-lesson-controller.yml'
  push:
    branches: [ main ]
    paths:
      - 'teaching/**'
      - 'teaching-backend.js'
      - 'index.js'
      - 'migrations/**'
      - 'tests/teaching/**'
      - 'scripts/verify-teaching-d11-lesson-controller.js'
      - 'docs/teaching/**'
      - 'package.json'
      - '.github/workflows/teaching-d11-lesson-controller.yml'

jobs:
  d11:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: D11 canonical verifier
        run: npm run verify:teaching:d11
      - name: D11 unit tests
        run: node --test tests/teaching/unit/d11-lesson-controller.test.js
      - name: Teaching unit regressions
        run: npm run test:teaching
      - name: Full test regressions
        run: npm test
      - name: Teaching integration contract tests
        run: npm run test:teaching:integration
      - name: Web build
        run: npm run build:web
