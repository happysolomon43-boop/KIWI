name: Temporary D17 Focused Test Diagnostics
on:
  push:
    branches: ['teaching/d17-assessment-domain']
permissions:
  contents: write
jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[d17-test-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: teaching/d17-assessment-domain}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Capture focused test
        shell: bash
        run: |
          set +e
          node --test tests/teaching/unit/d17-assessment-domain.test.js > .tmp-d17-test-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> .tmp-d17-test-output.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .tmp-d17-test-output.txt
          git commit -m 'Capture D17 focused test diagnostic [d17-test-diagnostic]'
          git push origin HEAD:teaching/d17-assessment-domain
