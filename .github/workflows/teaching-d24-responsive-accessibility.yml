name: Teaching D24 Responsive Accessibility
on:
  pull_request:
    paths: ['teaching/d24/**','public/teaching*','public/assessment-shell*','tests/teaching/**','scripts/verify-teaching-d*.js','docs/teaching/d24*','package.json','.github/workflows/teaching-d24-responsive-accessibility.yml']
  push:
    branches: [main, 'teaching/d24-responsive-accessibility']
    paths: ['teaching/d24/**','public/teaching*','public/assessment-shell*','tests/teaching/**','scripts/verify-teaching-d*.js','docs/teaching/d24*','package.json','.github/workflows/teaching-d24-responsive-accessibility.yml']
jobs:
  d24:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: D24 syntax and canonical verifier
        run: |
          node --check teaching/d24/contracts.js
          node --check teaching/d24/task-accounting.js
          node --check public/teaching-d24.js
          node --check public/teaching-classroom.js
          node --check public/assessment-shell.js
          npm run verify:teaching:d24
      - name: D01-D23 predecessor verifiers
        run: for n in $(seq -w 1 23); do npm run verify:teaching:d$n; done
      - run: node --test tests/teaching/unit/d24-*.test.js
      - run: npm run test:teaching
      - run: npm test
      - run: npm run build:web
  d24-integration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: kiwi_teaching_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_teaching_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEACHING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwi_teaching_test
      TEACHING_TEST_PROJECT_REF: local-d24-ci
      TEACHING_TEST_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: node scripts/setup-teaching-integration-db.js
      - run: npm run test:teaching:integration
