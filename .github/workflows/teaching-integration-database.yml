name: Teaching Integration Database

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'teaching/**'
      - 'tests/teaching/integration/**'
      - 'scripts/setup-teaching-integration-db.js'
      - 'package.json'
      - '.github/workflows/teaching-integration-database.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'teaching/**'
      - 'tests/teaching/integration/**'
      - 'scripts/setup-teaching-integration-db.js'
      - 'package.json'
      - '.github/workflows/teaching-integration-database.yml'

permissions:
  contents: read

jobs:
  integration-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kiwi_teaching_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_teaching_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      TEACHING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/kiwi_teaching_test
      TEACHING_TEST_PROJECT_REF: local-ci
      TEACHING_TEST_BOOTSTRAP: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Build isolated Teaching integration schema
        run: node scripts/setup-teaching-integration-db.js

      - name: Run Teaching database integration suite without skips
        run: npm run test:teaching:integration

      - name: Verify no Teaching browser-authoritative DML or RLS gaps
        run: |
          node - <<'NODE'
          const { Pool } = require('pg');
          (async () => {
            const pool = new Pool({
              connectionString: process.env.TEACHING_TEST_DATABASE_URL,
              ssl: false,
              max: 1,
            });
            try {
              const { rows } = await pool.query(`
                select
                  (select count(*)::int
                     from pg_class c join pg_namespace n on n.oid=c.relnamespace
                    where c.relkind='r'
                      and ((n.nspname='public' and c.relname like 'teaching_%')
                        or n.nspname in ('teaching_preparation','teaching_protected'))
                      and not c.relrowsecurity) as no_rls,
                  (select count(*)::int
                     from information_schema.role_table_grants
                    where ((table_schema='public' and table_name like 'teaching_%')
                        or table_schema in ('teaching_preparation','teaching_protected'))
                      and grantee in ('anon','authenticated')
                      and privilege_type in ('INSERT','UPDATE','DELETE','TRUNCATE')) as browser_dml
              `);
              if (rows[0].no_rls !== 0 || rows[0].browser_dml !== 0) {
                throw new Error(`Teaching DB safety invariant failed: ${JSON.stringify(rows[0])}`);
              }
              console.log('[Teaching integration] RLS/browser-authority invariants PASS', rows[0]);
            } finally {
              await pool.end();
            }
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
