name: Teaching D25 Reliability Recovery
on:
  pull_request:
    paths: ['teaching/d25/**','teaching/d17/routes.js','public/teaching-d24.js','public/teaching-d25*','public/assessment-shell*','tests/teaching/**','scripts/verify-teaching-d*.js','.github/workflows/teaching-d25-reliability.yml']
  push:
    branches: [main, 'teaching/d25-reliability-recovery']
    paths: ['teaching/d25/**','teaching/d17/routes.js','public/teaching-d24.js','public/teaching-d25*','public/assessment-shell*','tests/teaching/**','scripts/verify-teaching-d*.js','.github/workflows/teaching-d25-reliability.yml']
jobs:
  d25:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: D25 syntax and canonical verifier
        run: |
          node --check teaching/d25/contracts.js
          node --check teaching/d25/service.js
          node --check teaching/d25/routes.js
          node --check public/teaching-d25-reliability.js
          node --check public/teaching-d24.js
          node scripts/verify-teaching-d25-reliability.js
      - name: D01-D24 predecessor verifiers
        run: for n in $(seq -w 1 24); do npm run verify:teaching:d$n; done
      - run: node --test tests/teaching/unit/d25-*.test.js
      - run: npm run test:teaching
      - run: npm test
      - run: npm run build:web
  d25-integration-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: kiwi_teaching_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_teaching_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEACHING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwi_teaching_test
      TEACHING_TEST_PROJECT_REF: local-d25-ci
      TEACHING_TEST_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: node scripts/setup-teaching-integration-db.js
      - run: npm run test:teaching:integration
