name: Neutral Runtime V2 Health Constant Fix

on:
  push:
    branches:
      - aim/model-neutral-runtime-v2
    paths:
      - 'scripts/fix-neutral-health-constant.js'
      - '.github/workflows/neutral-runtime-v2-health-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Branch B
        uses: actions/checkout@v4
        with:
          ref: aim/model-neutral-runtime-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply guarded constant fix
        run: node scripts/fix-neutral-health-constant.js

      - name: Validate syntax and diff
        run: |
          node --check services/ai/orchestrator.js
          git diff --check

      - name: Commit fix and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/ai/orchestrator.js
          git rm scripts/fix-neutral-health-constant.js .github/workflows/neutral-runtime-v2-health-fix.yml
          git commit -m 'fix(ai): use route-aware provider health constant'
          git push origin HEAD:aim/model-neutral-runtime-v2
