name: Teaching D14 Classroom
on:
  pull_request:
    paths: ['teaching/**','public/teaching*','teaching-backend.js','index.js','migrations/**','tests/teaching/**','scripts/verify-teaching-d*.js','docs/teaching/**','package.json','.github/workflows/teaching-d14-classroom.yml']
  push:
    branches: [main]
    paths: ['teaching/**','public/teaching*','teaching-backend.js','index.js','migrations/**','tests/teaching/**','scripts/verify-teaching-d*.js','docs/teaching/**','package.json','.github/workflows/teaching-d14-classroom.yml']
jobs:
  d14:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: D01-D14 canonical verifiers
        run: for n in $(seq -w 1 14); do npm run verify:teaching:d$n; done
      - run: npm run test:teaching
      - run: npm test
      - run: npm run test:teaching:integration
      - run: npm run build:web
  d14-isolated-db:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: kiwi_teaching_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_teaching_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEACHING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwi_teaching_test
      TEACHING_TEST_PROJECT_REF: local-d14-ci
      TEACHING_TEST_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: node scripts/setup-teaching-integration-db.js
      - run: node --test tests/teaching/integration/d14-classroom-schema.test.js tests/teaching/integration/d14-visual-assets.test.js
