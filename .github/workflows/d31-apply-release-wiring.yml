name: D31 guarded owner-release wiring

on:
  push:
    branches:
      - teaching/d31-final-release-readiness
    paths:
      - .github/workflows/d31-apply-release-wiring.yml
      - scripts/apply-teaching-d31-release-wiring.js
      - scripts/reconcile-post-d30-study-import.js
      - teaching/d31/**
      - tests/ai/study-import-module.test.js
      - tests/ai/teaching-d31-owner-release.test.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out D31 branch
        uses: actions/checkout@v4
        with:
          ref: teaching/d31-final-release-readiness
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reconcile intended post-D30 Study import extraction
        run: node scripts/reconcile-post-d30-study-import.js

      - name: Apply guarded D31 release composition
        run: node scripts/apply-teaching-d31-release-wiring.js

      - name: Validate index syntax
        run: node --check index.js

      - name: Validate recovery and D31 owner-release contracts
        run: node --test tests/ai/study-import-module.test.js tests/ai/teaching-d31-owner-release.test.js

      - name: Validate web build
        run: npm run build

      - name: Validate diff hygiene
        run: git diff --check

      - name: Commit guarded index reconciliation
        shell: bash
        run: |
          if git diff --quiet -- index.js; then
            echo "index.js already has the reconciled post-D30 extraction and D31 release composition."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.js
          git commit -m "D31: reconcile study import and owner AI release wiring"
          git push origin HEAD:teaching/d31-final-release-readiness
