name: Teaching D22 Teacher Identity
on:
  pull_request:
    paths:
      - 'teaching/d22/**'
      - 'teaching/repositories/d22-teacher-identity.js'
      - 'teaching/repositories/index.js'
      - 'teaching/index.js'
      - 'teaching/d17/routes.js'
      - 'tests/teaching/**'
      - 'scripts/verify-teaching-d*.js'
      - 'scripts/setup-teaching-integration-db.js'
      - 'migrations/20261003_teaching_d22_*.sql'
      - 'docs/teaching/d22*'
      - 'package.json'
      - '.github/workflows/teaching-d22-teacher-identity.yml'
  push:
    branches: [main, 'teaching/d22-teacher-identity']
    paths:
      - 'teaching/d22/**'
      - 'teaching/repositories/d22-teacher-identity.js'
      - 'teaching/repositories/index.js'
      - 'teaching/index.js'
      - 'teaching/d17/routes.js'
      - 'tests/teaching/**'
      - 'scripts/verify-teaching-d*.js'
      - 'scripts/setup-teaching-integration-db.js'
      - 'migrations/20261003_teaching_d22_*.sql'
      - 'docs/teaching/d22*'
      - 'package.json'
      - '.github/workflows/teaching-d22-teacher-identity.yml'

jobs:
  d22:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: D22 syntax and canonical verifier
        run: |
          node --check teaching/d22/contracts.js
          node --check teaching/d22/intelligence.js
          node --check teaching/d22/service.js
          node --check teaching/d22/routes.js
          node --check teaching/d22/ui.js
          node --check teaching/d22/task-accounting.js
          node --check teaching/repositories/d22-teacher-identity.js
          npm run verify:teaching:d22
      - name: D01-D21 predecessor verifiers
        run: for n in $(seq -w 1 21); do npm run verify:teaching:d$n; done
      - name: D22 focused unit tests
        run: node --test tests/teaching/unit/d22-*.test.js
      - name: Teaching unit regressions
        run: npm run test:teaching
      - name: Full unit regressions
        run: npm test
      - name: Web build
        run: npm run build:web

  d22-isolated-db:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: kiwi_teaching_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_teaching_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEACHING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwi_teaching_test
      TEACHING_TEST_PROJECT_REF: local-d22-ci
      TEACHING_TEST_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: node scripts/setup-teaching-integration-db.js
      - run: node --test tests/teaching/integration/d21-progression-gpa-schema.test.js tests/teaching/integration/d22-teacher-identity-schema.test.js
      - run: npm run test:teaching:integration
