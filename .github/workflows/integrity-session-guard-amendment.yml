name: Integrity Session Guard Amendment
on:
  pull_request:
    paths:
      - 'services/integrity/**'
      - 'teaching/d16/**'
      - 'public/kiwi-integrity-session-guard.js'
      - 'public/teaching-d16.js'
      - 'public/teaching-d16.css'
      - 'public/teaching.html'
      - 'index.js'
      - 'index.html'
      - 'migrations/20261002_kiwi_integrity_session_guard.sql'
      - 'scripts/setup-teaching-integration-db.js'
      - 'tests/teaching/**'
      - '.github/workflows/integrity-session-guard-amendment.yml'
  push:
    branches: [teaching/integrity-session-guard-amendment]
    paths:
      - 'services/integrity/**'
      - 'teaching/d16/**'
      - 'public/kiwi-integrity-session-guard.js'
      - 'public/teaching-d16.js'
      - 'public/teaching-d16.css'
      - 'public/teaching.html'
      - 'index.js'
      - 'index.html'
      - 'migrations/20261002_kiwi_integrity_session_guard.sql'
      - 'scripts/setup-teaching-integration-db.js'
      - 'tests/teaching/**'
      - '.github/workflows/integrity-session-guard-amendment.yml'

jobs:
  amendment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Syntax check amendment runtime
        run: |
          node --check services/integrity/contracts.js
          node --check services/integrity/repository.js
          node --check services/integrity/service.js
          node --check services/integrity/routes.js
          node --check public/kiwi-integrity-session-guard.js
          node --check public/teaching-d16.js
          node --check index.js
      - name: Focused Integrity Session Guard behavior tests
        run: node --test tests/teaching/unit/integrity-session-guard-amendment.test.js
      - name: D01-D16 canonical verifiers
        run: for n in $(seq -w 1 16); do npm run verify:teaching:d$n; done
      - name: Teaching regressions
        run: npm run test:teaching
      - name: Full regressions
        run: npm test
      - name: Web build
        run: npm run build:web

  amendment-isolated-db:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_USER: postgres, POSTGRES_DB: kiwi_teaching_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d kiwi_teaching_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEACHING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kiwi_teaching_test
      TEACHING_TEST_PROJECT_REF: local-integrity-amendment-ci
      TEACHING_TEST_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - name: Reconstruct Teaching database through Integrity amendment
        run: node scripts/setup-teaching-integration-db.js
      - name: Integrity amendment schema tests
        run: node --test tests/teaching/integration/integrity-session-guard-schema.test.js
      - name: D02-D16 integration regressions on amended schema
        run: npm run test:teaching:integration
