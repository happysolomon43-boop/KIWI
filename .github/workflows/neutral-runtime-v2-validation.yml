name: Neutral Runtime V2 Branch Validation

on:
  push:
    branches:
      - aim/model-neutral-runtime-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Branch B
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check neutral AI module syntax
        run: |
          find services/ai -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check backend syntax
        run: node --check index.js

      - name: Run AI suite with compact failure summary
        shell: bash
        run: |
          set +e
          npm run test:ai 2>&1 | tee /tmp/kiwi-ai-tests.log
          status=${PIPESTATUS[0]}
          echo
          echo '===== KIWI AI COMPACT FAILURE SUMMARY ====='
          grep -E '^not ok|^# (tests|pass|fail|cancelled|skipped|todo|duration_ms)|AssertionError|ReferenceError|TypeError|ERR_ASSERTION|ERR_TEST_FAILURE' /tmp/kiwi-ai-tests.log | tail -n 300 || true
          exit "$status"
