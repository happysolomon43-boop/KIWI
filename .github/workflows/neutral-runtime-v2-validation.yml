name: Neutral Runtime V2 Branch Validation

on:
  push:
    branches:
      - aim/model-neutral-runtime-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-ai-tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.tests.outputs.matrix }}
    steps:
      - name: Checkout Branch B
        uses: actions/checkout@v4

      - id: tests
        name: Discover AI test files
        shell: bash
        run: |
          matrix=$(find tests/ai -type f -name '*.test.js' -print | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.[]'

  ai-test-file:
    needs: discover-ai-tests
    name: AI — ${{ matrix.file }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.discover-ai-tests.outputs.matrix) }}
    steps:
      - name: Checkout Branch B
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run ${{ matrix.file }}
        run: node --test "${{ matrix.file }}"

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Branch B
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check neutral AI module syntax
        run: find services/ai -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check backend syntax
        run: node --check index.js
