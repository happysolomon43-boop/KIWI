name: Neutral Runtime V2 Branch Validation

on:
  push:
    branches:
      - aim/model-neutral-runtime-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Branch B
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run AI tests and capture exact failures
        id: ai
        shell: bash
        run: |
          set +e
          : > neutral-runtime-ai-diagnostics.txt
          failed=0
          passed=0
          total=0
          while IFS= read -r file; do
            total=$((total + 1))
            tmp=$(mktemp)
            node --test "$file" >"$tmp" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
              {
                echo
                echo "================================================================================"
                echo "FAILED: $file"
                echo "================================================================================"
                cat "$tmp"
              } >> neutral-runtime-ai-diagnostics.txt
            fi
            rm -f "$tmp"
          done < <(find tests/ai -type f -name '*.test.js' -print | sort)
          {
            echo
            echo "================================================================================"
            echo "SUMMARY: total=$total passed=$passed failed=$failed"
            echo "================================================================================"
          } >> neutral-runtime-ai-diagnostics.txt
          cat neutral-runtime-ai-diagnostics.txt
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Upload AI diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neutral-runtime-ai-diagnostics
          path: neutral-runtime-ai-diagnostics.txt
          if-no-files-found: error
          retention-days: 2

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Branch B
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check neutral AI module syntax
        run: find services/ai -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check backend syntax
        run: node --check index.js
