<!doctype html>
<html lang="en" data-app="kiwi-teaching">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03110d" />
  <title>KIWI Teaching</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&amp;family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&amp;family=JetBrains+Mono:wght@300;400;500;600;700&amp;display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      color-scheme: dark;
      --teaching-bg: #03110d;
      --teaching-surface: rgba(8, 31, 24, 0.82);
      --teaching-surface-strong: rgba(7, 28, 21, 0.985);
      --teaching-border: rgba(116, 229, 180, 0.14);
      --teaching-border-strong: rgba(116, 229, 180, 0.28);
      --teaching-text: #edf8f3;
      --teaching-muted: #7ea294;
      --teaching-accent: #62d9a5;
      --teaching-accent-soft: rgba(98, 217, 165, 0.12);
      --teaching-shadow: 0 22px 70px rgba(0, 0, 0, 0.36);
      --font-display: "Syne", sans-serif;
      --font-body: "DM Sans", sans-serif;
      --font-mono: "JetBrains Mono", monospace;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 15% 10%, rgba(48, 151, 108, 0.08), transparent 28rem),
        radial-gradient(circle at 82% 66%, rgba(21, 105, 77, 0.06), transparent 32rem),
        var(--teaching-bg);
      color: var(--teaching-text);
      font-family: var(--font-body);
    }

    body {
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body[data-overlay-open="true"] {
      overflow: hidden;
    }

    button,
    a {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* Vercel injects this collaboration toolbar outside KIWI's own UI.
       It is intentionally suppressed in the Teaching app surface. */
    vercel-live-feedback,
    [data-vercel-feedback] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .teaching-app {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
      padding-top: var(--safe-top);
    }

    .teaching-topbar {
      min-height: 74px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px clamp(16px, 4vw, 38px);
      border-bottom: 1px solid var(--teaching-border);
      background: rgba(3, 17, 13, 0.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .teaching-menu-button,
    .teaching-icon-button {
      width: 44px;
      height: 44px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      border-radius: 14px;
      border: 1px solid var(--teaching-border);
      background: rgba(7, 27, 21, 0.76);
      color: #bcd9cc;
      cursor: pointer;
      flex: 0 0 auto;
      transition:
        border-color 160ms ease,
        background 160ms ease,
        color 160ms ease,
        transform 160ms ease;
    }

    .teaching-menu-button:hover,
    .teaching-menu-button:focus-visible,
    .teaching-icon-button:hover,
    .teaching-icon-button:focus-visible {
      outline: none;
      border-color: var(--teaching-border-strong);
      background: var(--teaching-accent-soft);
      color: var(--teaching-text);
    }

    .teaching-menu-button:active,
    .teaching-icon-button:active {
      transform: translateY(1px);
    }

    .teaching-menu-button svg,
    .teaching-icon-button svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }

    .teaching-brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      text-decoration: none;
      color: inherit;
      user-select: none;
    }

    .teaching-brand__kiwi {
      font-family: var(--font-display);
      font-size: clamp(18px, 2.8vw, 24px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: 0.17em;
    }

    .teaching-brand__divider {
      width: 1px;
      height: 27px;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(98, 217, 165, 0.64),
        transparent
      );
      flex: 0 0 auto;
    }

    .teaching-brand__name {
      font-family: var(--font-display);
      font-size: clamp(16px, 2.4vw, 22px);
      line-height: 1;
      font-weight: 650;
      letter-spacing: -0.025em;
      color: #cde8dc;
    }

    .teaching-stage {
      width: min(1320px, 100%);
      min-height: 0;
      margin: 0 auto;
      padding:
        clamp(22px, 5vw, 58px)
        clamp(18px, 4vw, 42px)
        calc(38px + var(--safe-bottom));
    }

    .teaching-stage:empty::before {
      content: "";
      display: block;
      min-height: 70vh;
    }

    .teaching-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      border: 0;
      padding: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .teaching-overlay[data-open="true"] {
      opacity: 1;
      pointer-events: auto;
    }

    .teaching-menu-panel {
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 41;
      width: min(390px, 90vw);
      height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        calc(18px + var(--safe-top))
        18px
        calc(18px + var(--safe-bottom));
      border-right: 1px solid var(--teaching-border);
      background:
        linear-gradient(180deg, rgba(12, 40, 31, 0.99), rgba(5, 23, 17, 0.995));
      box-shadow: var(--teaching-shadow);
      transform: translateX(-101%);
      transition: transform 220ms ease;
    }

    .teaching-menu-panel[data-open="true"] {
      transform: translateX(0);
    }

    .teaching-menu-panel__header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--teaching-border);
    }

    .teaching-menu-panel__title {
      min-width: 0;
    }

    .teaching-menu-panel__eyebrow {
      font-family: var(--font-mono);
      display: block;
      color: var(--teaching-muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .teaching-menu-panel__name {
      font-family: var(--font-display);
      display: block;
      margin-top: 3px;
      color: var(--teaching-text);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .teaching-menu-panel__close {
      margin-left: auto;
    }

    .teaching-menu-panel__body {
      min-height: 0;
      overflow-y: auto;
      padding: 18px 0;
    }

    .teaching-menu-future {
      display: grid;
      gap: 8px;
    }

    .teaching-menu-link {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 1px solid transparent;
      border-radius: 16px;
      background: transparent;
      color: #92b6a6;
      text-align: left;
      cursor: pointer;
    }

    .teaching-menu-link:hover,
    .teaching-menu-link:focus-visible {
      outline: none;
      color: var(--teaching-text);
      background: rgba(116, 229, 180, 0.055);
    }

    .teaching-menu-link[data-active="true"] {
      border-color: var(--teaching-border-strong);
      background: var(--teaching-accent-soft);
      color: var(--teaching-text);
    }

    .teaching-menu-link__icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: rgba(3, 17, 13, 0.66);
      color: var(--teaching-accent);
    }

    .teaching-menu-link__icon svg { width: 19px; height: 19px; stroke: currentColor; }
    .teaching-menu-link__copy { min-width: 0; }
    .teaching-menu-link__title { display: block; font-weight: 720; font-size: 14px; }
    .teaching-menu-link__description { display: block; margin-top: 2px; color: var(--teaching-muted); font-size: 11px; }
    .teaching-menu-link__arrow { color: #537565; font-size: 17px; }

    .teaching-menu-panel__footer {
      display: grid;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--teaching-border);
    }

    .teaching-menu-action {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 15px;
      border-radius: 16px;
      border: 1px solid var(--teaching-border);
      background: rgba(116, 229, 180, 0.035);
      color: #cce5da;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-weight: 730;
      transition:
        border-color 160ms ease,
        background 160ms ease,
        color 160ms ease;
    }

    .teaching-menu-action:hover,
    .teaching-menu-action:focus-visible {
      outline: none;
      border-color: var(--teaching-border-strong);
      background: var(--teaching-accent-soft);
      color: var(--teaching-text);
    }

    .teaching-menu-action svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      stroke: currentColor;
    }

    .teaching-menu-action__meta {
      margin-left: auto;
      color: var(--teaching-muted);
      font-size: 12px;
      font-weight: 650;
    }

    .teaching-settings-panel {
      position: fixed;
      inset: 0 0 0 auto;
      z-index: 43;
      width: min(390px, 90vw);
      height: 100dvh;
      padding:
        calc(18px + var(--safe-top))
        18px
        calc(18px + var(--safe-bottom));
      border-left: 1px solid var(--teaching-border);
      background: var(--teaching-surface-strong);
      box-shadow: -24px 0 60px rgba(0, 0, 0, 0.32);
      transform: translateX(101%);
      transition: transform 210ms ease;
    }

    .teaching-settings-panel[data-open="true"] {
      transform: translateX(0);
    }

    .teaching-settings-panel__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .teaching-settings-panel h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -0.015em;
    }

    .teaching-settings-panel__empty {
      margin-top: 34px;
      border-top: 1px solid var(--teaching-border);
      padding-top: 18px;
      color: var(--teaching-muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .teaching-dock-shell[hidden] {
      display: none !important;
    }

    .teaching-dock-shell {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 18;
      pointer-events: none;
      padding:
        0
        clamp(14px, 3vw, 34px)
        calc(10px + var(--safe-bottom));
    }

    .teaching-dock {
      pointer-events: auto;
      width: min(720px, 100%);
      min-height: 70px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
      border: 1px solid var(--teaching-border);
      border-radius: 23px;
      background: rgba(4, 20, 15, 0.92);
      box-shadow: var(--teaching-shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .teaching-dock::-webkit-scrollbar {
      display: none;
    }

    .teaching-dock__item {
      flex: 1 0 min(132px, 32vw);
      min-width: 92px;
      height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 15px;
      border: 1px solid rgba(116, 229, 180, 0.09);
      background: rgba(116, 229, 180, 0.035);
      color: #aac9bc;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
      font-weight: 720;
    }

    .teaching-dock__item:hover,
    .teaching-dock__item:focus-visible {
      outline: none;
      border-color: var(--teaching-border-strong);
      background: var(--teaching-accent-soft);
      color: var(--teaching-text);
    }

    .teaching-dock__icon {
      font-size: 16px;
      line-height: 1;
    }

    .teaching-confirm {
      width: min(430px, calc(100vw - 32px));
      padding: 0;
      border: 1px solid var(--teaching-border-strong);
      border-radius: 22px;
      color: var(--teaching-text);
      background: rgba(7, 28, 21, 0.985);
      box-shadow: var(--teaching-shadow);
    }

    .teaching-confirm::backdrop {
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(3px);
    }

    .teaching-confirm__content {
      padding: 24px;
    }

    .teaching-confirm h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: -0.02em;
    }

    .teaching-confirm p {
      margin: 10px 0 0;
      color: #9bbcaf;
      font-size: 14px;
      line-height: 1.55;
    }

    .teaching-confirm__actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 22px;
    }

    .teaching-confirm__button {
      min-height: 48px;
      border-radius: 14px;
      border: 1px solid var(--teaching-border);
      cursor: pointer;
      font-weight: 780;
    }

    .teaching-confirm__button--cancel {
      background: rgba(255, 255, 255, 0.03);
      color: #bfd7cc;
    }

    .teaching-confirm__button--confirm {
      background: var(--teaching-accent);
      color: #042217;
      border-color: transparent;
    }

    .teaching-view { animation: teaching-rise 360ms ease both; }
    @keyframes teaching-rise { from { opacity: 0; transform: translateY(8px); } }
    .teaching-kicker { color: var(--teaching-accent); font-family: var(--font-mono); font-size: 11px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; }
    .teaching-title { max-width: 820px; margin: 13px 0 0; font-family: var(--font-display); font-size: clamp(38px, 6vw, 72px); font-weight: 600; letter-spacing: -.055em; line-height: .98; }
    .teaching-lead { max-width: 660px; margin: 20px 0 0; color: #98b9aa; font-size: clamp(15px, 2vw, 18px); line-height: 1.65; }
    .teaching-hero { position: relative; overflow: hidden; padding: clamp(30px, 6vw, 68px); border: 1px solid var(--teaching-border); border-radius: 30px; background: linear-gradient(135deg, rgba(13,49,37,.88), rgba(4,21,16,.82)); box-shadow: var(--teaching-shadow); }
    .teaching-hero::after { content:""; position:absolute; width:420px; height:420px; right:-160px; top:-210px; border-radius:50%; border:1px solid rgba(98,217,165,.16); box-shadow: 0 0 90px rgba(98,217,165,.08), inset 0 0 70px rgba(98,217,165,.05); }
    .teaching-hero__actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:32px; position:relative; z-index:1; }
    .teaching-button { min-height:50px; display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:0 20px; border:1px solid var(--teaching-border); border-radius:14px; background:rgba(255,255,255,.025); color:#cce6db; font-weight:720; cursor:pointer; }
    .teaching-button:hover,.teaching-button:focus-visible { outline:none; border-color:var(--teaching-border-strong); background:var(--teaching-accent-soft); }
    .teaching-button--primary { border-color:transparent; background:var(--teaching-accent); color:#032116; }
    .teaching-button--primary:hover,.teaching-button--primary:focus-visible { background:#78e9b8; }
    .teaching-section { margin-top:38px; }
    .teaching-section__head { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:16px; }
    .teaching-section__head h2 { margin:5px 0 0; font-family:var(--font-display); font-size:clamp(24px,4vw,34px); letter-spacing:-.035em; }
    .teaching-course-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(245px,1fr)); gap:14px; }
    .teaching-course-card { min-height:190px; display:flex; flex-direction:column; padding:22px; border:1px solid var(--teaching-border); border-radius:21px; background:rgba(7,29,22,.72); transition:border-color 160ms ease,transform 160ms ease,background 160ms ease; }
    .teaching-course-card:hover { border-color:var(--teaching-border-strong); background:rgba(9,36,27,.8); transform:translateY(-1px); }
    .teaching-course-card__copy { min-width:0; display:flex; flex:1; flex-direction:column; }
    .teaching-course-card__state { align-self:flex-start; padding:5px 8px; border-radius:999px; background:var(--teaching-accent-soft); color:var(--teaching-accent); font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; }
    .teaching-course-card h3 { margin:18px 0 0; font-family:var(--font-display); font-size:20px; letter-spacing:-.025em; }
    .teaching-course-card p { margin:auto 0 0; padding-top:18px; color:var(--teaching-muted); font-size:13px; }
    .teaching-course-card__open { min-height:42px; margin-top:18px; padding:0 14px; align-self:flex-start; border:1px solid var(--teaching-border); border-radius:12px; background:rgba(255,255,255,.025); color:#cce6db; font-weight:720; cursor:pointer; }
    .teaching-course-card__open:hover,.teaching-course-card__open:focus-visible { outline:none; border-color:var(--teaching-border-strong); background:var(--teaching-accent-soft); color:var(--teaching-text); }
    .teaching-course-shell { max-width:1120px; margin:0 auto; }
    .teaching-course-context { display:grid; grid-template-columns:auto minmax(0,1fr); gap:18px; align-items:start; padding:6px 0 24px; }
    .teaching-course-back { min-height:42px; padding:0 13px; border:1px solid var(--teaching-border); border-radius:12px; background:rgba(255,255,255,.02); color:#bcd8cb; cursor:pointer; font-weight:700; }
    .teaching-course-back:hover,.teaching-course-back:focus-visible { outline:none; border-color:var(--teaching-border-strong); background:var(--teaching-accent-soft); color:var(--teaching-text); }
    .teaching-course-context__identity h1 { margin:7px 0 0; font-family:var(--font-display); font-size:clamp(30px,5vw,52px); letter-spacing:-.05em; line-height:1; }
    .teaching-course-context__identity p { margin:10px 0 0; color:var(--teaching-muted); font-size:13px; line-height:1.5; text-transform:capitalize; }
    .teaching-course-nav { display:flex; gap:8px; overflow-x:auto; overscroll-behavior-x:contain; scrollbar-width:none; padding:8px 0 16px; border-bottom:1px solid var(--teaching-border); }
    .teaching-course-nav::-webkit-scrollbar { display:none; }
    .teaching-course-nav__item { min-height:42px; flex:0 0 auto; padding:0 15px; border:1px solid transparent; border-radius:12px; background:transparent; color:#87aa9b; cursor:pointer; font-weight:700; }
    .teaching-course-nav__item:hover,.teaching-course-nav__item:focus-visible { outline:none; color:var(--teaching-text); background:rgba(116,229,180,.055); }
    .teaching-course-nav__item[data-active="true"] { border-color:var(--teaching-border-strong); background:var(--teaching-accent-soft); color:var(--teaching-text); }
    .teaching-course-content { padding-top:22px; }
    .teaching-course-overview-card { padding:clamp(24px,4vw,34px); border:1px solid var(--teaching-border); border-radius:24px; background:linear-gradient(145deg,rgba(11,42,32,.78),rgba(4,21,16,.72)); }
    .teaching-course-overview-card__head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    .teaching-course-overview-card h2,.teaching-course-feature-section__head h2 { margin:7px 0 0; font-family:var(--font-display); font-size:clamp(24px,4vw,34px); letter-spacing:-.04em; }
    .teaching-course-overview-card > p { max-width:690px; margin:14px 0 0; color:var(--teaching-muted); line-height:1.65; }
    .teaching-course-facts { display:flex; flex-wrap:wrap; gap:8px; margin-top:22px; }
    .teaching-course-fact { padding:8px 10px; border:1px solid var(--teaching-border); border-radius:999px; background:rgba(2,14,10,.42); color:#a9cbbd; font-size:11px; }
    .teaching-course-feature-section { margin-top:28px; }
    .teaching-course-feature-section__head { margin-bottom:14px; }
    .teaching-course-feature-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(285px,1fr)); gap:14px; }
    .teaching-course-feature-slot { min-width:0; }
    .teaching-empty { grid-column:1/-1; padding:28px; border:1px dashed var(--teaching-border-strong); border-radius:20px; color:var(--teaching-muted); line-height:1.6; }
    .teaching-intake-header { max-width:760px; }
    .teaching-intake-header .teaching-title { font-size:clamp(34px,5vw,58px); }
    .teaching-stepbar { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:30px 0; padding:0; list-style:none; }
    .teaching-step { display:flex; align-items:center; gap:11px; min-height:62px; padding:11px; border:1px solid var(--teaching-border); border-radius:15px; color:var(--teaching-muted); font-size:12px; }
    .teaching-step[data-active="true"] { border-color:var(--teaching-border-strong); background:var(--teaching-accent-soft); color:var(--teaching-text); }
    .teaching-step__number { width:31px; height:31px; display:grid; place-items:center; flex:0 0 auto; border-radius:10px; background:rgba(1,12,9,.65); color:var(--teaching-accent); font-family:var(--font-mono); font-size:11px; }
    .teaching-intake-layout { display:grid; grid-template-columns:minmax(220px,.68fr) minmax(0,1.55fr); gap:18px; align-items:start; }
    .teaching-intake-aside { position:sticky; top:104px; padding:25px; border:1px solid var(--teaching-border); border-radius:22px; background:rgba(7,29,22,.56); }
    .teaching-intake-aside h2 { margin:10px 0 0; font-family:var(--font-display); font-size:23px; letter-spacing:-.03em; }
    .teaching-intake-aside p { color:var(--teaching-muted); line-height:1.6; font-size:13px; }
    .teaching-assurance { display:grid; gap:13px; margin-top:23px; padding-top:20px; border-top:1px solid var(--teaching-border); }
    .teaching-assurance__item { display:grid; grid-template-columns:24px 1fr; gap:9px; color:#afd0c1; font-size:12px; line-height:1.45; }
    .teaching-assurance__mark { width:22px; height:22px; display:grid; place-items:center; border-radius:50%; background:var(--teaching-accent-soft); color:var(--teaching-accent); }
    .teaching-form { overflow:hidden; border:1px solid var(--teaching-border); border-radius:24px; background:var(--teaching-surface); box-shadow:var(--teaching-shadow); }
    .teaching-form__section { padding:clamp(22px,4vw,34px); border-bottom:1px solid var(--teaching-border); }
    .teaching-form__section:last-of-type { border-bottom:0; }
    .teaching-form__section h2 { margin:0; font-family:var(--font-display); font-size:22px; letter-spacing:-.025em; }
    .teaching-form__section > p { margin:7px 0 0; color:var(--teaching-muted); font-size:13px; line-height:1.55; }
    .teaching-field { display:grid; gap:8px; margin-top:19px; }
    .teaching-field label { color:#d8ece3; font-weight:650; font-size:13px; }
    .teaching-field input,.teaching-field select,.teaching-field textarea { width:100%; border:1px solid var(--teaching-border); border-radius:13px; background:rgba(2,14,10,.7); color:var(--teaching-text); padding:13px 14px; font:inherit; transition:border-color 150ms ease,box-shadow 150ms ease; }
    .teaching-field input:focus,.teaching-field select:focus,.teaching-field textarea:focus { outline:none; border-color:rgba(98,217,165,.62); box-shadow:0 0 0 3px rgba(98,217,165,.09); }
    .teaching-field textarea { min-height:132px; resize:vertical; line-height:1.55; }
    .teaching-field small { color:var(--teaching-muted); line-height:1.45; }
    .teaching-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 15px; }
    .teaching-form__footer { padding:20px clamp(22px,4vw,34px); background:rgba(2,15,11,.54); }
    .teaching-submit { min-height:50px; padding:0 22px; border:0; border-radius:14px; background:var(--teaching-accent); color:#042217; font-weight:750; cursor:pointer; }
    .teaching-submit:disabled { opacity:.55; cursor:wait; }
    .teaching-message { margin-top:15px; padding:13px 15px; border-radius:13px; background:rgba(98,217,165,.09); color:#cce9dc; line-height:1.5; font-size:13px; }
    .teaching-message[data-kind="error"] { background:rgba(242,105,105,.1); color:#ffc8c8; }
    .teaching-success { padding:clamp(28px,6vw,58px); text-align:center; border:1px solid var(--teaching-border-strong); border-radius:25px; background:linear-gradient(145deg,rgba(12,50,37,.88),rgba(4,20,15,.88)); }
    .teaching-success__mark { width:58px; height:58px; display:grid; place-items:center; margin:0 auto 18px; border-radius:19px; background:var(--teaching-accent); color:#042217; font-size:25px; }
    .teaching-success h2 { margin:0; font-family:var(--font-display); font-size:30px; letter-spacing:-.04em; }
    .teaching-success p { max-width:560px; margin:12px auto 0; color:#9fc1b2; line-height:1.65; }
    .teaching-success .teaching-button { margin-top:24px; }

    @media (max-width: 640px) {
      .teaching-topbar {
        min-height: 66px;
        gap: 10px;
        padding-left: 14px;
        padding-right: 14px;
      }

      .teaching-menu-button {
        width: 42px;
        height: 42px;
      }

      .teaching-brand {
        gap: 9px;
      }

      .teaching-brand__kiwi {
        font-size: 17px;
      }

      .teaching-brand__name {
        font-size: 16px;
      }

      .teaching-brand__divider {
        height: 23px;
      }

      .teaching-stage {
        padding-left: 16px;
        padding-right: 16px;
      }

      .teaching-menu-panel,
      .teaching-settings-panel {
        width: min(360px, 92vw);
      }

      .teaching-grid { grid-template-columns: 1fr; }

      .teaching-stepbar { grid-template-columns: 1fr; }

      .teaching-intake-layout { grid-template-columns: 1fr; }

      .teaching-intake-aside { position:static; }

      .teaching-confirm__actions {
        grid-template-columns: 1fr;
      }

      .teaching-course-context {
        grid-template-columns: 1fr;
        gap: 13px;
      }

      .teaching-course-back {
        justify-self: start;
      }

      .teaching-course-overview-card__head {
        flex-direction: column;
      }
    }

    @media (min-width: 641px) and (max-width: 900px) {
      .teaching-intake-layout { grid-template-columns: 1fr; }
      .teaching-intake-aside { position: static; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body data-app="kiwi-teaching">
  <div class="teaching-app">
    <header class="teaching-topbar">
      <button
        id="teachingMenuButton"
        class="teaching-menu-button"
        type="button"
        aria-label="Open Teaching menu"
        aria-controls="teachingMenuPanel"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>

      <a class="teaching-brand" href="/teaching.html" aria-label="KIWI Teaching home">
        <span class="teaching-brand__kiwi">KIWI</span>
        <span class="teaching-brand__divider" aria-hidden="true"></span>
        <span class="teaching-brand__name">Teaching</span>
      </a>
    </header>

    <main id="teachingApp" class="teaching-stage" aria-label="KIWI Teaching workspace"></main>
  </div>

  <button
    id="teachingOverlay"
    class="teaching-overlay"
    type="button"
    aria-label="Close Teaching menu"
  ></button>

  <aside
    id="teachingMenuPanel"
    class="teaching-menu-panel"
    aria-label="Teaching menu"
    aria-hidden="true"
  >
    <div class="teaching-menu-panel__header">
      <div class="teaching-menu-panel__title">
        <span class="teaching-menu-panel__eyebrow">KIWI</span>
        <span class="teaching-menu-panel__name">Teaching</span>
      </div>
      <button
        id="teachingMenuClose"
        class="teaching-icon-button teaching-menu-panel__close"
        type="button"
        aria-label="Close Teaching menu"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>

    <div class="teaching-menu-panel__body">
      <nav id="teachingMenuFuture" class="teaching-menu-future" aria-label="Teaching sections"></nav>
    </div>

    <div class="teaching-menu-panel__footer">
      <button id="teachingSettingsButton" class="teaching-menu-action" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" aria-hidden="true">
          <path d="M12 8.4a3.6 3.6 0 1 0 0 7.2 3.6 3.6 0 0 0 0-7.2Z"/>
          <path d="M19.2 13.4a7.6 7.6 0 0 0 .05-2.8l2-1.55-2-3.46-2.48 1a8.2 8.2 0 0 0-2.42-1.4L14 2.55h-4l-.35 2.64a8.2 8.2 0 0 0-2.42 1.4l-2.48-1-2 3.46 2 1.55a7.6 7.6 0 0 0 .05 2.8l-2.05 1.6 2 3.45 2.54-1.02a8 8 0 0 0 2.32 1.34L10 21.45h4l.38-2.68a8 8 0 0 0 2.32-1.34l2.54 1.02 2-3.45-2.04-1.6Z"/>
        </svg>
        <span>Settings</span>
      </button>

      <button id="teachingSwitchToKiwiButton" class="teaching-menu-action" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" aria-hidden="true">
          <path d="M10 7 5 12l5 5"/>
          <path d="M5 12h11"/>
          <path d="M16 5h3v14h-3"/>
        </svg>
        <span>Switch to KIWI</span>
        <span class="teaching-menu-action__meta">Study app</span>
      </button>
    </div>
  </aside>

  <aside
    id="teachingSettingsPanel"
    class="teaching-settings-panel"
    aria-label="Teaching settings"
    aria-hidden="true"
  >
    <div class="teaching-settings-panel__header">
      <h2>Settings</h2>
      <button
        id="teachingSettingsClose"
        class="teaching-icon-button"
        type="button"
        aria-label="Close Teaching settings"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>

    <div class="teaching-settings-panel__empty">
      Teaching-specific settings will live here as the app is built.
    </div>
  </aside>

  <div id="teachingDockShell" class="teaching-dock-shell" hidden>
    <nav id="teachingDock" class="teaching-dock" aria-label="Teaching navigation"></nav>
  </div>

  <template id="teachingDockItemTemplate">
    <button class="teaching-dock__item" type="button">
      <span class="teaching-dock__icon" aria-hidden="true"></span>
      <span class="teaching-dock__label"></span>
    </button>
  </template>

  <dialog id="teachingConfirmDialog" class="teaching-confirm">
    <div class="teaching-confirm__content">
      <h2 id="teachingConfirmTitle">Switch to KIWI?</h2>
      <p id="teachingConfirmMessage">
        You are leaving KIWI Teaching and returning to the KIWI study app.
      </p>
      <div class="teaching-confirm__actions">
        <button
          id="teachingConfirmCancel"
          class="teaching-confirm__button teaching-confirm__button--cancel"
          type="button"
        >
          Stay in Teaching
        </button>
        <button
          id="teachingConfirmAccept"
          class="teaching-confirm__button teaching-confirm__button--confirm"
          type="button"
        >
          Switch to KIWI
        </button>
      </div>
    </div>
  </dialog>

  <script src="/kiwi-runtime-config.js"></script>
  <script src="/kiwi-api-client.js"></script>
  <script type="module" src="/teaching.js"></script>
  <script type="module" src="/teaching-d08.js"></script>
</body>
</html>
